name: Deploy k8s

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_sha: ${{ steps.build-push.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Экшен сам получает токен и логинит docker — ID аккаунта брать неоткуда не нужно.
      - name: Вход в ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push образа
        id: build-push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_SHA="$REGISTRY/devops-backend-api:sha-${{ github.sha }}"
          IMAGE_LATEST="$REGISTRY/devops-backend-api:latest"
          docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT

  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name devops-cluster \
            --region ${{ vars.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_sha }}
        run: |
          helm upgrade myapp ./helm/myapp \
            --reuse-values \
            --set backend.image.repository="${IMAGE_URI%:*}" \
            --set backend.image.tag="${IMAGE_URI##*:}" \
            --set backend.probes.health=/app/health \
            --set backend.probes.ready=/app/ready \
            --wait \
            --timeout 4m

