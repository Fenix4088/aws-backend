# StorageClass на томах gp3 для EBS CSI драйвера.
# Ставится ВРУЧНУЮ (kubectl apply -f), вне чартов: ресурс кластерного уровня,
# не должен удаляться вместе с релизом postgres. См. cluster-issuer.yaml — та же схема.
#
# ТРЕБУЕТ: аддон aws-ebs-csi-driver + IAM-роль для ebs-csi-controller-sa (IRSA).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-sc
  annotations:
    # Обязательно: volumeClaimTemplates в чарте postgres НЕ задаёт storageClassName,
    # значит PVC уйдёт в default-класс. Без этой аннотации том создастся на встроенном
    # gp2 EKS-а, а ebs-sc останется неиспользованным.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
# WaitForFirstConsumer — том создаётся только когда Pod уже назначен на ноду,
# и в ТОЙ ЖЕ AZ. EBS-том зонален: при Immediate том может уехать в AZ без свободной ноды.
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
